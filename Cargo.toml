[package]
name = "xoodyak"
version = "0.8.5"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "Xoodyak lightweight cryptography: authenticated encryption (AEAD), hashing, and MACs based on Xoodoo, with no_std support"
readme = "README.md"
keywords = ["xoodyak", "xoodoo", "aead", "hash", "mac"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-xoodyak"
repository = "https://github.com/jedisct1/rust-xoodyak"
categories = ["no-std", "cryptography", "wasm"]

[features]
default = ["std"]
std = []

[dependencies]
zeroize = { version = "1.9", default-features = false }

[dev-dependencies]
benchmark-simple = "0.1.11"

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"
lto = "fat"

[profile.bench]
codegen-units = 1

[[bench]]
name = "benchmark"
harness = false
